  - data/processed/swisstopo/chant_sura_fluelapass_portability_example_v1
  - validation/private/chant_sura_fluelapass_portability_example_v1
  - hazard/results/chant_sura_fluelapass_portability_example_v1
claim_boundary:
  current_allowed_products:
    - unweighted_diagnostic
    - sampling_weighted_conditional
    - conditional_intensity_exceedance
  future_products:
    - physical_probability
    - annual_intensity_frequency
  unsupported_current_claims:
    - annual_frequency
    - return_period
    - physical_probability
    - risk_map
    - operational_hazard_map
    - validated_hazard_map
  notes:
    - Freeze the AOI target only; do not imply real public-geodata staging.
    - The acquisition boundary remains read-only and non-operational.
dry_run_commands:
  - step: bootstrap_aoi_manifest
    command: PYENV_VERSION=system uv run python scripts/bootstrap_aoi_manifest.py --output-root /tmp/aoi_smoke/site --site-id chant_sura_fluelapass_portability_example_v1 --bounds 2793000 1180200 2793800 1180800 --format json
    purpose: Materialize a scratch AOI package from the frozen bounds.
  - step: acquisition_planner
    command: PYENV_VERSION=system uv run python scripts/plan_swisstopo_aoi_acquisition.py --site-config tests/fixtures/second_site_public_geodata_preflight/chant_sura_fluelapass_candidate.yaml --format json
    purpose: Show the exact public products, tile ids, and ignored roots for the selected AOI.
  - step: second_site_preflight
    command: PYENV_VERSION=system uv run python scripts/check_second_site_public_geodata_preflight.py --site-config tests/fixtures/second_site_public_geodata_preflight/chant_sura_fluelapass_candidate.yaml --format json
    purpose: Keep the target read-only and fail closed on missing inputs.
